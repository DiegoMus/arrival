<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

</head>
<body>
    <h1>Clientes</h1>

    <form id="form-cliente" class="row g-3">
        <div class="col-md-4">
            <input type="text" class="form-control" name="nombre" placeholder="Nombre" required> 
        </div>

        <div class="col-md-4">
            <input type="text" class="form-control" name="apellido" placeholder="Apellido" required>
        </div>
        <div class="col-md-4">
            <input type="text" class="form-control" name="telefono" placeholder="Teléfono" required>    
        </div>
        <div class="col-md-4">
            <input type="text" class="form-control" name="dpi" placeholder="DPI" required>  
        </div>

        <div class="col-md-4">
            <button class="btn btn-info" type="submit">Agregar Cliente</button>
        </div>

      
    </form>
    <div id="mensaje" class="mt-3"></div>
    <table id="tabla-clientes">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>DPI</th>
                <th>Teléfono</th>
              
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function cargarClientes() {
            const res = await fetch('/clientes');
            const clientes = await res.json();
            const cuerpo = document.querySelector('#tabla-clientes tbody');
            cuerpo.innerHTML = '';

            clientes.forEach(c => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${c.IDCLIENTE}</td>
                    <td>${c.NOMBRE}</td>
                    <td>${c.APELLIDO}</td>
                    <td>${c.DPI}</td>
                    <td>${c.TELEFONO}</td>
                    <td>
                        <button onclick="editarCliente(${c.IDCLIENTE})">Editar</button>
                        <button onclick="eliminarCliente(${c.IDCLIENTE})">Eliminar</button>
                        <button onclick="registrotarjeta(${c.IDCLIENTE})">Metodos de Pago</button>
                    </td>
                `;
                cuerpo.appendChild(fila);
            });
        }


        async function registrotarjeta(idCliente) {
            window.location.href = `/tarjeta/formulario?idcliente=${idCliente}`;            
        }

        async function eliminarCliente(id) {
            await fetch(`/clientes/${id}`, { method: 'DELETE' });
            cargarClientes();
        }

        function editarCliente(id) {
            // Aquí puedes implementar la lógica para editar un cliente
            // Por ejemplo, abrir un formulario modal con los datos del cliente
            alert('Funcionalidad de edición no implementada aún.');
        }

        document.getElementById('form-cliente').addEventListener('submit', async e => {
            e.preventDefault();
            const datos = Object.fromEntries(new FormData(e.target).entries());
            try{
                const resp = await fetch('/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
         
            const respuesta = await resp.json();
            if (resp.ok) {
                    document.getElementById('mensaje').innerHTML =
                        `<div class="alert alert-success">${respuesta.mensaje}</div>`;
                    e.target.reset();
                    cargarClientes();
                } else {
                    document.getElementById('mensaje').innerHTML =
                        `<div class="alert alert-danger">Error: ${respuesta.error}</div>`;
                }
                
            }catch(error){
                document.getElementById('mensaje').innerHTML =`<div class="alert alert-danger">Error de red o servidor.</div>`;
            }
        });

        cargarClientes();
    </script>
</body>
</html>
