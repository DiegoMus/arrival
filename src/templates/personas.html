<body class="container mt-5">

    <h1 class="mb-4">Boleto - Personas</h1>

    <form id="form-persona" class="row g-3">
        
        <input type="hidden" id="idpasajero">
        <div class="col-md-4">
            <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
        </div>
        <div class="col-md-4">
            <input type="text" class="form-control" id="apellido" placeholder="Apellido" required>
        </div>
        <div class="col-md-2">
            <input type="text" class="form-control" id="dpi" placeholder="DPI" required>
        </div>
        <div class="col-md-2">
            <input type="date" class="form-control" id="fecha" placeholder="Fecha" required>
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" id="vacunas" placeholder="Vacunas" required>
        </div>
        <div class="col-md-2">  
            <input name="idreserva" id="reserva" value="{{ idreserva }}">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Guardar</button>
        </div>

    </form>

    <hr>

    <table class="table table-bordered mt-4">
        <thead class="table-dark">
          
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>DPI</th>
                <th>VACUNAS</th>
                <th>FECHA DE NAC</th>
                
                
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-personas"></tbody>
    </table>

    <script>
        const params = new URLSearchParams(window.location.search);
        const idReserva = params.get('idreserva');

        async function cargarPersonas() {
        const res = await fetch(`/pasajero/${idReserva}`);
        const data = await res.json();
        console.log("Respuesta del servidor:", data); // 🔍

        if (!Array.isArray(data)) {
        console.error("La respuesta no es un array:", data);
        return;
        }

        const cuerpo = document.getElementById('tabla-personas');
        cuerpo.innerHTML = '';

        data.forEach(p => {
        cuerpo.innerHTML += `
            <tr>
                <td>${p.IDPASAJERO}</td>
                <td>${p.NOMBRE}</td>
                <td>${p.APELLIDO}</td>
                <td>${p.DPI}</td>
                <td>${p.VACUNAS}</td>
                <td>${p.NACIMIENTO}</td>
                <td>
                 <!--   <button class="btn btn-sm btn-warning" onclick='editar(${JSON.stringify(p)})'>Editar</button> -->
                    <button class="btn btn-sm btn-danger" onclick='eliminar(${p.IDPASAJERO})'>Eliminar</button>
                    <button class="btn btn-sm btn-danger" onclick='abrirFormularioBoleto(${p.IDPASAJERO})'>Boleto</button>
            
                    
                </td>
            </tr>
            `;
        });
        }

        function abrirFormularioBoleto(idPasajero) {
        window.location.href = `/boleto/formulario?idpasajero=${idPasajero}`;
        }


        document.getElementById('form-persona').addEventListener('submit', async e => {
            e.preventDefault();
            const id = document.getElementById('idpasajero').value;
            const datos = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                dpi: document.getElementById('dpi').value,
                vacunas: parseInt(document.getElementById('vacunas').value),
                nacimiento: document.getElementById('fecha').value + ' 00:00:00.000', 
                idreserva: parseInt(document.getElementById('reserva').value)              
            };

            if (id) {
                await fetch(`/personas/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
            } else {
                await fetch('/personas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
            }

            e.target.reset();
            document.getElementById('idpasajero').value = '';
            cargarPersonas();
        });

        function editar(persona) {
            document.getElementById('idpasajero').value = persona.IDPASAJERO;
            document.getElementById('nombre').value = persona.NOMBRE;
            document.getElementById('apellido').value = persona.APELLIDO;
            document.getElementById('vacunas').value = persona.EDAD;
        }

        async function eliminar(id) {
            if (confirm('¿Estás seguro de eliminar esta persona?')) {
                await fetch(`/personas/${id}`, { method: 'DELETE' });
                cargarPersonas();
            }
        }

        cargarPersonas();
    </script>

</body>
