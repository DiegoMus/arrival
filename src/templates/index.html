<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gestión de Reservas</title>
    <link rel="stylesheet" href="{{ url_for('styles', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <h1>Reservas</h1>

    <form id="form-reserva" class="row g-3">
        <div class="col-md-4">
            <input type="number" class= "form-control" placeholder="Asientos" name="asientos" required>
        </div>
        <div class="col-md-4">
        <input type="number" class= "form-control" placeholder="Valor Cobro" name="varlocobro" required>
        </div>
        <div class="col-md-4">
            <input type="number" class= "form-control" placeholder="Valor Total" name="valortotal" required>
        </div>
        
        <div class="col-md-4">
        <input type="number" class= "form-control"  placeholder="ID Cliente" name="idcliente" value="{{ idcliente }}" required>
        </div>
        <div class="col-md-4">
        <input type="number" class= "form-control"  placeholder="ID Tarjeta" name="idtarjeta" value="{{ idtarjeta }}" required>
        </div>
        <div class = "col-md-4">
        <input type="number" class= "form-control"  placeholder="ID Vuelo" name="idvuelo" value="{{ idvuelo }}" required>
        </div>
        <div class="col-md-4">
             <button class="btn btn-info" type="submit">Agregar Reserva</button>    
             
        </div>
    </form>

    <table id="tabla-reservas">
        <thead>
            <tr>
                <th>ID</th>
                <th>Asientos</th>
                <th>Estado</th>
                <th>Valor Total</th>
                <th>CLIENTE</th>
                    

                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>

       

        document.getElementById('idcliente').value = idCliente;


        async function cargarReservas() {
            const res = await fetch('/reservas');
            const reservas = await res.json();
            const cuerpo = document.querySelector('#tabla-reservas tbody');
            cuerpo.innerHTML = '';

            reservas.forEach(r => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${r.IDRESERVA}</td>
                    <td>${r.ASIENTOS}</td>
                    <td>${r.DESCRIPCION}</td>
                    <td>$. ${r.VALORTOTAL}</td>
                    <td>${r.NOMBRE}  ${r.APELLIDO} </td>
                    

                    
                    <td>
                
                        <button onclick="cancelar(${r.IDRESERVA}, 3)">Cancelar Reserva</button>
                        <button onclick="abrirFormularioPersonas(${r.IDRESERVA})">Registro pasajeros</button>
                    </td>
                    
                        
                    
                `;
                cuerpo.appendChild(fila);
            });
        }

        async function eliminar(id) {
            await fetch(`/reservas/${id}`, { method: 'DELETE' });
            cargarReservas();
        }

        function abrirFormularioPersonas(idReserva) {
        window.location.href = `/personas/formulario?idreserva=${idReserva}`;
        }

        async function cancelar(id, nuevo_estado) {
        const datos = { idestado: nuevo_estado }; // Creamos el cuerpo del PUT

        await fetch(`/reservas/${id}/estado`, { 
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
    });

    cargarReservas(); // Refrescar la tabla
}


        document.getElementById('form-reserva').addEventListener('submit', async e => {
            e.preventDefault();
            const datos = Object.fromEntries(new FormData(e.target).entries());
            // Convertir todos los valores a número (excepto strings si los hubiera)
            for (let clave in datos) datos[clave] = parseInt(datos[clave]);

            // Agregar campo cancelación como null
            datos.fechacancelacion = null;

            const resp = await fetch('/reservas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)


            
            

            });

            if (!resp.ok) {
                const error = await resp.json();
                alert("Error al guardar la reserva: " + (error.error || resp.statusText));
                return;
            }

            e.target.reset();
            cargarReservas();
        });

        cargarReservas();
    </script>
