<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Boleto</title>
    <link rel="stylesheet" href="{{ url_for('styles', filename='style.css') }}">
</head>
<body class="container mt-5">

    <h2 class="mb-4">Registrar Boleto</h2>

    <form id="form-boleto" class="row g-3">
        <div class="col-md-4">
            <input type="text" id="no_asiento" class="form-control" placeholder="Número de Asiento" required>
        </div>
        <div class="col-md-4">
            <input type="number" id="costo" class="form-control" placeholder="Costo" required>
        </div>
        <div class="col-md-4">
            <input type="number" id="idpasajero" class="form-control" placeholder="ID Pasajero" value="{{ idpasajero }}">
        </div>
        <div class="col-md-4">
            <input type="number" id="idvuelo" class="form-control" placeholder="ID Vuelo" required>
        </div>
        <div class="col-md-4">
            <input type="text" id="pais_origen" class="form-control" placeholder="País Origen" required>
        </div>
        <div class="col-md-4">
            <input type="text" id="pais_destino" class="form-control" placeholder="País Destino" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Guardar</button>
        </div>
    </form>

    <div id="mensaje" class="mt-3"></div>

    <script>
        document.getElementById('form-boleto').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = {
                NO_ASIENTO: document.getElementById('no_asiento').value,
                COSTO: parseFloat(document.getElementById('costo').value),
                IDPASAJERO: parseInt(document.getElementById('idpasajero').value),
                IDVUELO: parseInt(document.getElementById('idvuelo').value),
                PAIS_ORIGEN: document.getElementById('pais_origen').value,
                PAIS_DESTINO: document.getElementById('pais_destino').value,
            };

            try {
                const res = await fetch('/boletos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const respuesta = await res.json();

                if (res.ok) {
                    document.getElementById('mensaje').innerHTML =
                        `<div class="alert alert-success">${respuesta.mensaje}</div>`;
                    e.target.reset();
                } else {
                    document.getElementById('mensaje').innerHTML =
                        `<div class="alert alert-danger">Error: ${respuesta.error}</div>`;
                }
            } catch (err) {
                document.getElementById('mensaje').innerHTML =
                    `<div class="alert alert-danger">Error de red o servidor.</div>`;
            }
        });
    </script>
</body>
